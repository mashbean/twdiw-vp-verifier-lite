# mashbean VP verifier — Cloudflare Worker + Durable Object.
#
# Deploy:  npm install && npx wrangler login && npm run deploy
# Local:   npm run dev   (http://localhost:8787)
#
name = "mashbean-vp-verifier"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# This OAuth login has two accounts; pin the one that owns the deploy so
# `wrangler deploy` isn't ambiguous in non-interactive runs. (Account id, not a secret.)
account_id = "fd8f8ed12dcdfd03ad171a3a74bc712a"

# Custom domain on the mashbean.net zone (which is on this Cloudflare account).
# Wrangler creates the DNS + cert automatically. The workers.dev URL keeps working.
routes = [
  { pattern = "verifier.mashbean.net", custom_domain = true }
]

# One Durable Object instance per presentation session holds the nonce and the
# verification result — strong, read-after-write consistent, unlike KV. Self-expires
# via an alarm (see src/session.ts).
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "PresentationSession"

# The verifier's own signing identity (the P-256 key behind its did:key client_id),
# a singleton generated once and persisted. See src/identity.ts.
[[durable_objects.bindings]]
name = "IDENTITY"
class_name = "VerifierIdentity"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresentationSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VerifierIdentity"]

[vars]
# The public origin the wallet will POST the vp_token back to. Set this to your
# deployed URL (https://verifier.mashbean.net) so `response_uri` is reachable.
# For `wrangler dev` it is filled in from the request origin if left blank.
VERIFIER_ORIGIN = "https://verifier.mashbean.net"

# Pin the exact production issuer carried by the government-wallet card from
# the 2026-08-30 device run. This DID is independently present in the official
# API + Arbitrum trust snapshot captured by the wallet; an empty list would turn
# this deployment back into a demo that accepts any resolvable did:key.
TRUSTED_ISSUERS = "did:key:z2dmzD81cgPx8Vki7JbuuMmFYrWPgYoytykUZ3eyqht1j9Kbptwspp6uLnxpQQwn6TjHDw31q6bpSprrhMuKSkozn8R25MLf5g5H64FpiFmhCxKiU7JpU5dgBx3UbiSunqJ2a1athYQ88y4gYigJJefB1mybvtAssdMu2BUS3MwFe6pg4C"
