[package]
name = "openac-age-verifier"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native verifier for the 有備而來 OpenAC age-predicate proof (Prepare + Show, Spartan2/Hyrax on P-256)."
publish = false

[[bin]]
name = "openac-age-verifier"
path = "src/main.rs"

[dependencies]
# The reviewed zkID revision the iOS binding was built from (Native/OpenACAge/README.md in bonds-tw/backupTW-iOS).
ecdsa-spartan2 = { git = "https://github.com/ethereum/zkID.git", rev = "b395e09c225ff45b003f0087c28e2e208e22f944", default-features = false }
spartan2 = { git = "https://github.com/0xVikasRushi/Spartan2.git", branch = "openac-sdk", default-features = false }
ff = "0.13"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
subtle = "2"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
