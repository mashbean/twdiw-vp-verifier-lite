# Builds the native age-proof verifier image and pushes it to the Cloudflare
# managed registry, where `wrangler.mashbean.jsonc` references it by tag.
#
# This runs in CI rather than on a laptop for two reasons. Cloudflare Containers
# require `linux/amd64`, which on an Apple Silicon machine means an emulated
# build; and building at all requires Docker, which a deploy of a pre-built
# image does not. So the image is built here, and `wrangler deploy` stays
# runnable from anywhere.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN, with permission to edit
# Workers scripts and manage containers for the account in wrangler.mashbean.jsonc.

name: Container image

on:
  push:
    branches: [main]
    paths:
      - "native/openac-age-verifier/**"
      - ".github/workflows/container.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build and push"
        required: false
        default: "openac-age-v1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The Rust build compiles Spartan2 and its curve dependencies from git, and
    # the image pulls 417 MB of verifying key.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Fails the build if a release asset was republished: the Dockerfile
      # checks both the gzip and the installed SHA-256 of each verifying key
      # against the digests compiled into the service.
      - name: Build and push the image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || 'openac-age-v1' }}"
          npx wrangler containers build ./native/openac-age-verifier \
            --tag "openac-age-verifier:${tag}" \
            --push \
            --config wrangler.mashbean.jsonc

      # The URI printed here must match the `image` field in
      # wrangler.mashbean.jsonc, which is what a deploy pulls.
      - name: Show what is in the registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler containers images list --config wrangler.mashbean.jsonc
